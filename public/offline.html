<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#245b49" />
    <title>Vun Từ — Đang ngoại tuyến</title>
    <style>
      :root {
        color: #1c2a24;
        background: #f3eee3;
        font-family: "Segoe UI", Arial, system-ui, sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        display: grid;
        place-items: center;
        margin: 0;
        padding: 24px;
        background:
          radial-gradient(circle at 10% 10%, rgb(210 103 73 / 10%), transparent 24rem),
          #f3eee3;
      }

      main {
        width: min(520px, 100%);
        padding: 42px;
        text-align: center;
        background: #fffdf8;
        border: 1px solid #ddd3c3;
        border-radius: 28px;
        box-shadow: 0 24px 60px rgb(51 42 30 / 12%);
      }

      .mark {
        position: relative;
        width: 72px;
        height: 72px;
        display: grid;
        place-items: center;
        margin: 0 auto 26px;
        color: #fffaf0;
        background: #245b49;
        border-radius: 22px 22px 22px 8px;
      }

      .mark::before {
        width: 3px;
        height: 34px;
        background: currentcolor;
        border-radius: 4px;
        content: "";
        transform: translateY(7px);
      }

      .mark::after {
        position: absolute;
        top: 20px;
        left: 24px;
        width: 25px;
        height: 14px;
        background: currentcolor;
        border-radius: 90% 10% 90% 10%;
        content: "";
        transform: rotate(23deg);
      }

      h1 {
        margin: 0 0 13px;
        font-family: Cambria, Georgia, serif;
        font-size: clamp(2.2rem, 10vw, 3.2rem);
        font-weight: 500;
        letter-spacing: -0.045em;
        line-height: 1;
      }

      p {
        margin: 0 0 25px;
        color: #5f6d65;
        line-height: 1.65;
      }

      button {
        min-height: 48px;
        padding: 11px 19px;
        color: #fffdf8;
        background: #245b49;
        border: 0;
        border-radius: 14px;
        font: 700 0.9rem "Segoe UI", Arial, system-ui, sans-serif;
        cursor: pointer;
      }

      button:focus-visible {
        outline: 3px solid rgb(27 107 81 / 30%);
        outline-offset: 3px;
      }

      @media (prefers-color-scheme: dark) {
        :root,
        body {
          color: #f3efe6;
          background: #111a16;
        }

        body {
          background:
            radial-gradient(circle at 10% 10%, rgb(224 123 93 / 8%), transparent 24rem),
            #111a16;
        }

        main {
          background: #1c2923;
          border-color: #34463d;
          box-shadow: 0 24px 60px rgb(0 0 0 / 30%);
        }

        p {
          color: #bec8c1;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true"></div>
      <h1>Bạn đang ngoại tuyến.</h1>
      <p>
        Nếu đã mở Vun Từ ít nhất một lần, bộ thẻ trên thiết bị vẫn dùng được.
        Hãy kết nối mạng lại để đồng bộ dữ liệu mới.
      </p>
      <button type="button" onclick="location.reload()">Thử kết nối lại</button>
    </main>
  </body>
</html>
